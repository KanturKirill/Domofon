<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Домофоны</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --bg:#f2f2f7; --surface:#fff; --surface2:#e5e5ea;
  --accent:#007aff; --text:#000; --text2:#6e6e73; --border:#c6c6c8;
  --red:#ff3b30; --green:#34c759; --orange:#ff9500;
}
body { background:var(--bg); color:var(--text); font-family:-apple-system,sans-serif; min-height:100vh; width:100%; overflow-x:hidden; }
table { -webkit-user-select:none; user-select:none; }
td { -webkit-user-select:none; user-select:none; }

.header { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:8px 12px 7px; }
.header-row1 { display:flex; align-items:center; justify-content:space-between; margin-bottom:7px; }
.header-title { font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); }
.header-btns { display:flex; gap:4px; }
.hbtn { padding:4px 8px; border:none; border-radius:7px; color:#fff; font-size:11px; font-weight:700; cursor:pointer; }
.filters { display:flex; gap:4px; }
.filter-btn { flex:1; padding:7px 6px; background:var(--bg); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:11px; text-align:left; cursor:pointer; display:flex; justify-content:space-between; align-items:center; min-width:0; }
.filter-btn span:first-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.filter-btn.active { border-color:var(--accent); color:var(--accent); background:#e8f0fe; }
.stats { padding:3px 12px; font-size:10px; color:var(--text2); }
.stats b { color:var(--accent); }

.table-wrap { width:100%; overflow:hidden; }
table { width:100%; border-collapse:collapse; table-layout:fixed; }
colgroup col:nth-child(1) { width:18px; }
colgroup col:nth-child(2) { width:44%; }
colgroup col:nth-child(3) { width:22px; }
colgroup col:nth-child(4) { width:26%; }
colgroup col:nth-child(5) { width:28px; }
colgroup col:nth-child(6) { width:44px; }
thead th {
  background:#d0d0d8;
  padding:2px 3px;
  font-size:9px;
  font-weight:700;
  color:#333;
  border:1px solid #a0a0a8;
  text-align:center;
  overflow:hidden;
  height:20px;
  line-height:20px;
}
tbody tr { line-height:0; }
td {
  padding:1px 3px;
  vertical-align:middle;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  border:1px solid #b0b0b8;
  height:22px;
  line-height:22px;
  font-size:11px;
}
td:nth-child(1) { text-align:center; font-size:11px; font-weight:800; color:#000; background:#fff; width:22px; }
td:nth-child(1):not(:empty) { }
td:nth-child(2) { font-size:11px; font-weight:400; color:#000; direction:rtl; text-align:left; }
td:nth-child(3) { text-align:center; font-size:11px; }
td:nth-child(4) { font-size:10px; color:#000; font-family:'SF Mono',monospace; }
td:nth-child(4)[contenteditable="true"] { overflow:visible; white-space:normal; word-break:break-all; background:#fffde7; border:2px solid var(--accent)!important; z-index:10; position:relative; min-width:200px; }
td:nth-child(5) { font-size:9px; color:#666; text-align:center; }
td:nth-child(6) { text-align:right; padding:1px 2px; border:none; background:transparent; }

.btn-kod { display:inline-flex; align-items:center; justify-content:center; height:20px; width:38px; border-radius:3px; background:var(--accent); border:none; cursor:pointer; font-size:9px; font-weight:700; color:#fff; }
.btn-kod.copied { background:var(--green); }

.c-blue{background:#00B0F0!important} .c-orange{background:#FFC000!important}
.c-blue td:first-child,.c-orange td:first-child,.c-green td:first-child,.c-yellow td:first-child,
.c-cyan td:first-child,.c-gold td:first-child,.c-lime td:first-child,.c-amber td:first-child,
.c-teal td:first-child,.c-brown td:first-child{color:#000!important}
.c-green{background:#92D050!important} .c-yellow{background:#FFFF00!important}
.c-cyan{background:#00FFFF!important} .c-gold{background:#F1C232!important}
.c-lime{background:#00FF00!important} .c-amber{background:#BF9000!important}
.c-teal{background:#D0E0E3!important} .c-brown{background:#7F6000!important}
/* Цвет текста на ярком фоне */
.c-blue td,.c-orange td,.c-green td,.c-yellow td,.c-cyan td,.c-gold td,.c-lime td,.c-amber td,.c-teal td,.c-brown td{color:#000!important}

#ctx-overlay { position:fixed; inset:0; z-index:500; opacity:0; pointer-events:none; transition:opacity .15s; }
#ctx-overlay.show { opacity:1; pointer-events:auto; }
#ctx-menu { position:fixed; background:var(--surface); border-radius:13px; box-shadow:0 8px 32px rgba(0,0,0,.18); z-index:501; min-width:200px; overflow:hidden; opacity:0; pointer-events:none; transition:all .15s; top:50%; left:50%; transform:translate(-50%,-50%) scale(.9); }
#ctx-menu.show { opacity:1; pointer-events:auto; transform:translate(-50%,-50%) scale(1); }
.ctx-addr { padding:10px 14px 6px; font-size:11px; color:var(--text2); border-bottom:1px solid var(--border); }
.ctx-colors { display:flex; gap:6px; padding:10px 14px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
.ctx-chip { width:26px; height:26px; border-radius:50%; cursor:pointer; border:2px solid transparent; display:flex; align-items:center; justify-content:center; font-size:11px; }
.ctx-chip.sel { border-color:#333; transform:scale(1.15); }
.ctx-item { display:flex; align-items:center; gap:10px; padding:12px 14px; cursor:pointer; font-size:14px; color:var(--text); border-bottom:1px solid #f0f0f0; }
.ctx-item:last-child { border-bottom:none; }
.ctx-item:active { background:var(--bg); }
.ctx-item.danger { color:var(--red); }
.ctx-icon { font-size:16px; width:20px; text-align:center; }

#copy-overlay { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:300; opacity:0; pointer-events:none; transition:opacity .2s; }
#copy-overlay.show { opacity:1; pointer-events:auto; }
#copy-popup { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) scale(.88); background:var(--surface); border-radius:16px; padding:18px 20px; z-index:301; opacity:0; pointer-events:none; transition:all .18s; text-align:center; min-width:260px; max-width:88vw; box-shadow:0 8px 40px rgba(0,0,0,.15); }
#copy-popup.show { opacity:1; pointer-events:auto; transform:translate(-50%,-50%) scale(1); }
.popup-label { font-size:11px; color:var(--text2); margin-bottom:6px; }
.popup-main { font-size:20px; font-weight:800; color:var(--red); line-height:1.55; margin:8px 0 4px; white-space:pre-wrap; }
.popup-ok { font-size:12px; color:var(--green); margin-top:10px; opacity:0; transition:opacity .25s; }
.popup-ok.visible { opacity:1; }

#edit-overlay { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:600; opacity:0; pointer-events:none; transition:opacity .2s; }
#edit-overlay.show { opacity:1; pointer-events:auto; }
#edit-popup { position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-radius:16px 16px 0 0; border-top:1px solid var(--border); z-index:601; transform:translateY(100%); transition:transform .25s; max-height:82vh; display:flex; flex-direction:column; }
#edit-popup.show { transform:translateY(0); }
.edit-header { padding:11px 14px 8px; border-bottom:1px solid var(--border); flex-shrink:0; }
.edit-title { font-size:13px; font-weight:700; color:var(--accent); margin-bottom:2px; }
.edit-sub { font-size:11px; color:var(--text2); }
.edit-body { flex:1; overflow-y:auto; padding:10px 14px; display:flex; gap:10px; }
.edit-col { flex:1; display:flex; flex-direction:column; min-width:0; }
.edit-col-title { font-size:10px; color:var(--text2); font-weight:600; text-transform:uppercase; margin-bottom:5px; }
.edit-col-cur { font-size:11px; color:var(--accent); margin-bottom:5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.edit-col input { width:100%; padding:6px 8px; background:var(--bg); border:1px solid var(--border); border-radius:7px; color:var(--text); font-size:11px; margin-bottom:5px; }
.edit-col input:focus { outline:none; border-color:var(--accent); }
.edit-options { flex:1; overflow-y:auto; border:1px solid var(--border); border-radius:8px; min-height:130px; }
.edit-option { padding:8px 10px; font-size:12px; color:var(--text); cursor:pointer; border-bottom:1px solid #eee; }
.edit-option:last-child { border-bottom:none; }
.edit-option.selected { color:var(--accent); font-weight:600; background:#e8f0fe; }
.edit-footer { padding:10px 14px 22px; border-top:1px solid var(--border); display:flex; gap:8px; flex-shrink:0; }
.edit-btn { flex:1; padding:10px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; border:none; }
.edit-btn-cancel { background:var(--bg); color:var(--text2); }
.edit-btn-save { background:var(--accent); color:#fff; }

.ms-overlay { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:200; opacity:0; pointer-events:none; transition:opacity .2s; }
.ms-overlay.show { opacity:1; pointer-events:auto; }
.ms-panel { position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-radius:16px 16px 0 0; border-top:1px solid var(--border); z-index:201; transform:translateY(100%); transition:transform .25s; max-height:75vh; display:flex; flex-direction:column; }
.ms-panel.show { transform:translateY(0); }
.ms-header { padding:11px 14px 8px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.ms-title { font-size:13px; font-weight:700; }
.ms-actions { display:flex; gap:8px; }
.ms-btn { padding:5px 12px; border-radius:7px; font-size:12px; cursor:pointer; border:none; }
.ms-btn-clear { background:var(--bg); color:var(--text2); }
.ms-btn-apply { background:var(--accent); color:#fff; font-weight:600; }
.ms-search { padding:8px 12px; flex-shrink:0; }
.ms-search input { width:100%; padding:7px 10px; background:var(--bg); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:12px; }
.ms-list { overflow-y:auto; flex:1; padding:4px 0 8px; }
.ms-item { display:flex; align-items:center; gap:10px; padding:9px 14px; cursor:pointer; font-size:13px; }
.ms-item:active { background:var(--bg); }
.ms-checkbox { width:20px; height:20px; border-radius:5px; border:2px solid var(--border); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff; }
.ms-item.selected .ms-checkbox { background:var(--accent); border-color:var(--accent); }

#loading { position:fixed; inset:0; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:9999; }
#loading p { margin-top:12px; color:var(--text2); font-size:14px; }
.spinner { width:36px; height:36px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }



.empty-hint { text-align:center; padding:40px 20px; color:var(--text2); font-size:14px; }
</style>
<script src="data.js" onload="if(typeof initDB==='function')initDB()" onerror="document.getElementById('loading').innerHTML='<p style=\"color:red;padding:20px;text-align:center\">Ошибка: файл<br><b>data.js</b><br>не найден рядом с HTML</p>'"></script>
</head>
<body>

<div id="loading"><div class="spinner"></div><p>Загрузка базы...</p></div>

<div class="header">
  <div class="header-row1">
    <div class="header-title">📋 Домофоны Москвы</div>
    <div class="header-btns">
      <button class="hbtn" style="background:var(--accent)" onclick="exportExcel()">Excel</button>
      <button class="hbtn" id="btn-undo" style="background:#8e8e93;display:none" onclick="undoAction()">↩ Отмена</button>
    </div>
  </div>
  <div class="filters">
    <button class="filter-btn" id="btn-okrug" onclick="openPanel('okrug')">
      <span id="lbl-okrug">Округ</span><span>▾</span>
    </button>
    <button class="filter-btn" id="btn-district" onclick="openPanel('district')">
      <span id="lbl-district">Район</span><span>▾</span>
    </button>
    <button class="filter-btn" id="btn-metro" onclick="openPanel('metro')">
      <span id="lbl-metro">Метро</span><span>▾</span>
    </button>
  </div>
</div>
<div class="stats" id="stats"></div>

<div class="table-wrap">
  <table>
    <colgroup><col><col><col><col><col><col></colgroup>
    <thead><tr><th>№</th><th>Адрес</th><th>Пд</th><th>Код</th><th>Окр</th><th></th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
</div>
<div style="height:8px"></div>

<span id="counter" style="display:none">0</span>
<div id="ctx-overlay" onclick="closeCtx()"></div>
<div id="ctx-menu">
  <div class="ctx-addr" id="ctx-addr"></div>
  <div class="ctx-colors" id="ctx-colors"></div>
  <div class="ctx-item" onclick="ctxEdit()"><span class="ctx-icon">✏️</span> Изменить район / метро</div>
  <div class="ctx-item danger" onclick="ctxDelete()"><span class="ctx-icon">🗑</span> Удалить строку</div>
  <div class="ctx-item" onclick="closeCtx()" style="color:var(--text2);justify-content:center">Отмена</div>
</div>

<div id="copy-overlay" onclick="closeCopy()"></div>
<div id="copy-popup">
  <div class="popup-label" id="popup-addr"></div>
  <div class="popup-main" id="popup-text"></div>
  <div class="popup-ok" id="popup-ok">✓ Скопировано!</div>
</div>

<div id="edit-overlay" onclick="closeEdit()"></div>
<div id="edit-popup">
  <div class="edit-header">
    <div class="edit-title">✏️ Район и метро</div>
    <div class="edit-sub" id="edit-addr"></div>
  </div>
  <div class="edit-body">
    <div class="edit-col">
      <div class="edit-col-title">Район</div>
      <div class="edit-col-cur" id="edit-cur-d"></div>
      <input type="text" id="edit-d-search" placeholder="Поиск..." oninput="filterEditList('d')">
      <div class="edit-options" id="edit-d-list"></div>
    </div>
    <div class="edit-col">
      <div class="edit-col-title">Метро</div>
      <div class="edit-col-cur" id="edit-cur-m"></div>
      <input type="text" id="edit-m-search" placeholder="Поиск..." oninput="filterEditList('m')">
      <div class="edit-options" id="edit-m-list"></div>
    </div>
  </div>
  <div class="edit-footer">
    <button class="edit-btn edit-btn-cancel" onclick="closeEdit()">Отмена</button>
    <button class="edit-btn edit-btn-save" onclick="saveEdit()">Сохранить</button>
  </div>
</div>

<div class="ms-overlay" id="ms-overlay" onclick="closePanel()"></div>
<div class="ms-panel" id="ms-panel">
  <div class="ms-header">
    <div class="ms-title" id="ms-title"></div>
    <div class="ms-actions">
      <button class="ms-btn ms-btn-clear" onclick="clearSel()">Сбросить</button>
      <button class="ms-btn ms-btn-apply" onclick="applyPanel()">Готово</button>
    </div>
  </div>
  <div class="ms-search"><input type="text" id="ms-search" placeholder="Поиск..." oninput="filterMsList()"></div>
  <div class="ms-list" id="ms-list"></div>
</div>

<script>
var RAW=[], ALL_STATIONS=[], ALL_DISTRICTS=[], ALL_OKRUGS=[];
var counter=parseInt(localStorage.getItem('cnt')||'0');
var marks=JSON.parse(localStorage.getItem('marks')||'{}');
var overrides=JSON.parse(localStorage.getItem('overrides')||'{}');
var _ghSaveTimer=null;
var _ghSaving=false;
var undoStack=[];
var deleted=JSON.parse(localStorage.getItem('deleted')||'{}');
var selOkrugs=new Set(), selDistricts=new Set(), selMetros=new Set();
var filtered=[], currentPanel=null, tempSel=new Set();
var ctxIdx=null, editIdx=null, editNewD, editNewM, editNewColor;

document.getElementById('counter').textContent=counter;

const COLOR_MAP={'FF00B0F0':'c-blue','FFFFC000':'c-orange','FF92D050':'c-green','FFFFFF00':'c-yellow','FF00FFFF':'c-cyan','FFF1C232':'c-gold','FF00FF00':'c-lime','FFBF9000':'c-amber','FFD0E0E3':'c-teal','FF7F6000':'c-brown'};
const CTX_COLORS=[{k:'',bg:'#e5e5ea',label:'Нет'},{k:'FF00B0F0',bg:'#00B0F0',label:'Синий'},{k:'FFFFC000',bg:'#FFC000',label:'Оранжевый'},{k:'FF92D050',bg:'#92D050',label:'Зелёный'},{k:'FFFFFF00',bg:'#FFFF00',label:'Жёлтый'},{k:'FF00FFFF',bg:'#00FFFF',label:'Голубой'},{k:'FFF1C232',bg:'#F1C232',label:'Золотой'}];

// Загрузка базы через script tag (работает локально в Safari)
function initDB() {
  if (typeof DB === 'undefined') {
    document.getElementById('loading').innerHTML = '<p style="color:red;padding:20px;text-align:center">Ошибка загрузки базы.<br><br>Убедитесь что файл<br><b>data.js</b><br>лежит рядом с HTML файлом<br>в одной папке</p>';
    return;
  }
  RAW=DB.rows; ALL_STATIONS=DB.stations; ALL_DISTRICTS=DB.districts; ALL_OKRUGS=DB.okrugs;
  if(ALL_OKRUGS.indexOf("")===-1) ALL_OKRUGS.unshift("");
  if(ALL_DISTRICTS.indexOf("")===-1) ALL_DISTRICTS.unshift("");
  document.getElementById('loading').style.display='none';
  applyFilters();
}

function getRow(r){
  var key=r.a+'|'+r.e, ov=overrides[key]||{};
  return Object.assign({},r,{d:ov.d!==undefined?ov.d:r.d, m:ov.m!==undefined?ov.m:r.m, c1:ov.c1!==undefined?ov.c1:r.c1, c2:ov.c2!==undefined?ov.c2:r.c2, color:ov.color!==undefined?ov.color:r.color, visits:ov.visits!==undefined?ov.visits:(r.visits||0), o:r.o||''});
}

function applyFilters(){
  if(!selOkrugs.size&&!selDistricts.size&&!selMetros.size){
    document.getElementById('tbody').innerHTML='<tr><td colspan="6"><div class="empty-hint">Выберите округ, район или метро</div></td></tr>';
    document.getElementById('stats').innerHTML=''; updateBtns(); return;
  }
  filtered=RAW.map(function(r,i){var row=getRow(r);row._idx=i;return row;}).filter(function(r){
    if(deleted[r._idx]) return false;
    var oMatch=!selOkrugs.size||selOkrugs.has(r.o)||(selOkrugs.has("")&&!r.o);
    var dMatch=!selDistricts.size||selDistricts.has(r.d)||(selDistricts.has("")&&!r.d);
    var mMatch=!selMetros.size||selMetros.has(r.m);
    if(!oMatch) return false;
    if(selDistricts.size&&selMetros.size) return dMatch||mMatch;
    return dMatch&&mMatch;
  });
  renderTable(); updateBtns();
}

function renderTable(){
  var tbody=document.getElementById('tbody');
  document.getElementById('stats').innerHTML='Показано: <b>'+filtered.length+'</b> из <b>'+RAW.length+'</b>';
  tbody.innerHTML='';
  filtered.forEach(function(r,i){
    var key=r.a+'|'+r.e, mark=marks[key]||'';
    var code=[r.c1,r.c2].filter(Boolean).join(', ');
    var codeParts=code.split(',');
    var displayCode=code; // показываем все коды, CSS обрежет лишнее
    var tr=document.createElement('tr');
    var cls=r.color?(COLOR_MAP[r.color]||''):'';
    if(cls) tr.className=cls;

    var t0=document.createElement('td');
    t0.setAttribute('data-visit-key',key);
    if(r.visits>0){t0.textContent=r.visits;t0.style.fontWeight='700';t0.style.color='#007aff';}
    else{t0.textContent=r.n||'';}
    tr.appendChild(t0);

    var t1=document.createElement('td');t1.textContent=r.a;tr.appendChild(t1);
    var t2=document.createElement('td');t2.textContent=r.e;tr.appendChild(t2);

    var t3=document.createElement('td');t3.textContent=displayCode;t3.setAttribute('data-idx',r._idx);
    t3.addEventListener('dblclick',function(){startEditCode(this);});
    (function(cell){var last=0;cell.addEventListener('touchend',function(e){var now=Date.now();if(now-last<300){e.preventDefault();startEditCode(cell);}last=now;});})(t3);
    tr.appendChild(t3);

    var tO=document.createElement('td');tO.textContent=r.o||'';tr.appendChild(tO);

    var t4=document.createElement('td');
    var btn=document.createElement('button');
    btn.className='btn-kod'+(mark?' copied':'');
    btn.textContent=mark?'✓':'КОД';
    btn.onclick=(function(idx){return function(e){e.stopPropagation();copyRow(idx);};})(r._idx);
    t4.appendChild(btn);tr.appendChild(t4);

    (function(row,idx){
      var timer=null;
      row.addEventListener('touchstart',function(){timer=setTimeout(function(){timer=null;openCtx(idx);},500);},{passive:true});
      row.addEventListener('touchend',function(){if(timer){clearTimeout(timer);timer=null;}});
      row.addEventListener('touchmove',function(){if(timer){clearTimeout(timer);timer=null;}},{passive:true});
      row.addEventListener('contextmenu',function(e){e.preventDefault();openCtx(idx);});
    })(tr,r._idx);

    tbody.appendChild(tr);
  });
}

function updateBtns(){
  document.getElementById('lbl-okrug').textContent=selOkrugs.size?(selOkrugs.size===1?[...selOkrugs][0]:'Округов: '+selOkrugs.size):'Округ';
  document.getElementById('btn-okrug').classList.toggle('active',!!selOkrugs.size);
  document.getElementById('lbl-district').textContent=selDistricts.size?(selDistricts.size===1?[...selDistricts][0]:'Районов: '+selDistricts.size):'Район';
  document.getElementById('btn-district').classList.toggle('active',!!selDistricts.size);
  document.getElementById('lbl-metro').textContent=selMetros.size?(selMetros.size===1?[...selMetros][0]:'Метро: '+selMetros.size):'Метро';

function openCtx(rawIdx){

}
function renderCtxColors(){
  var el=document.getElementById('ctx-colors');el.innerHTML='';
  CTX_COLORS.forEach(function(c){
    var chip=document.createElement('div');
    chip.className='ctx-chip'+(editNewColor===c.k?' sel':'');

function saveCtxColor(){
  var r=RAW[ctxIdx],key=r.a+'|'+r.e,ov=overrides[key]||{};
  var prevOv=JSON.parse(JSON.stringify(ov));
  undoStack.push({type:'color',idx:ctxIdx,key:key,prev:prevOv});

  document.getElementById('btn-undo').style.display='';

function ctxEdit(){closeCtx();openEdit(ctxIdx);}
function ctxDelete(){closeCtx();deleteRow(ctxIdx);}
function closeCtx(){document.getElementById('ctx-overlay').classList.remove('show');document.getElementById('ctx-menu').classList.remove('show');}

function copyRow(rawIdx){
  var r=getRow(RAW[rawIdx]);
  var codes=[r.c1,r.c2].filter(Boolean).join(', ');
  var firstCode=codes.split(',')[0].trim();
  var txt=r.a+'\nп: '+r.e+'\nКод: '+firstCode+'\nЭтаж: ';
  document.getElementById('popup-addr').textContent=r.a+' • Подъезд '+r.e;
  document.getElementById('popup-text').textContent='Код: '+firstCode+'\nЭтаж: ';
  document.getElementById('popup-ok').classList.remove('visible');
  document.getElementById('copy-popup').classList.add('show');
  document.getElementById('copy-overlay').classList.add('show');
  // Копируем rich text с красным цветом 18pt
  var htmlTxt = '<span style="color:red;font-size:18pt;font-weight:bold">' +
    r.a + '&nbsp;&nbsp;п' + r.e +
    '<br>код ' + firstCode + '&nbsp;&nbsp;Этаж </span>';
  try {
    var item = new ClipboardItem({
      'text/plain': new Blob([txt], {type:'text/plain'}),
      'text/html':  new Blob([htmlTxt], {type:'text/html'})
    });
    navigator.clipboard.write([item]).then(function(){
      document.getElementById('popup-ok').classList.add('visible');
    }).catch(function(){
      navigator.clipboard.writeText(txt).then(function(){
        document.getElementById('popup-ok').classList.add('visible');
      });
    });
  } catch(e) {
    if(navigator.clipboard){navigator.clipboard.writeText(txt).then(function(){document.getElementById('popup-ok').classList.add('visible');});}
    else{var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);document.getElementById('popup-ok').classList.add('visible');}
  }
  var key=r.a+'|'+r.e,now=new Date();
  marks[key]=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
  localStorage.setItem('marks',JSON.stringify(marks));
  var ov=overrides[key]||{};ov.visits=(ov.visits||0)+1;overrides[key]=ov;
  localStorage.setItem('overrides',JSON.stringify(overrides));
  counter++;localStorage.setItem('cnt',counter);
  document.getElementById('counter').textContent=counter;
  document.querySelectorAll('td[data-visit-key]').forEach(function(cell){
    if(cell.getAttribute('data-visit-key')===key){cell.textContent=ov.visits;cell.style.fontWeight='700';cell.style.color='#007aff';}
  });
  setTimeout(function(){closeCopy();},1200);
}
function closeCopy(){document.getElementById('copy-popup').classList.remove('show');document.getElementById('copy-overlay').classList.remove('show');}

function startEditCode(cell){
  cell.contentEditable='true';cell.focus();
  var range=document.createRange();range.selectNodeContents(cell);range.collapse(false);
  window.getSelection().removeAllRanges();window.getSelection().addRange(range);
  function finish(){
    cell.contentEditable='false';
    var idx=parseInt(cell.getAttribute('data-idx'));
    var parts=cell.textContent.trim().split(',').map(function(s){return s.trim();});
    var r=RAW[idx],key=r.a+'|'+r.e,ov=overrides[key]||{};
    ov.c1=parts[0]||'';ov.c2=parts[1]||'';
    overrides[key]=ov;localStorage.setItem('overrides',JSON.stringify(overrides));
  }
  cell.addEventListener('blur',finish,{once:true});
  cell.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();cell.blur();}});
}

function openEdit(rawIdx){
  editIdx=rawIdx;var r=getRow(RAW[rawIdx]);
  editNewD=r.d;editNewM=r.m;
  document.getElementById('edit-addr').textContent=r.a+' • Подъезд '+r.e;

  renderEditList('m',ALL_STATIONS,r.m);

}
function renderEditList(type,items,cur){

    var d=document.createElement('div');d.className='edit-option'+(v===cur?' selected':'');d.textContent=v;

function filterEditList(type){

function selectEdit(type,val){

  else{editNewM=val;document.getElementById('edit-cur-m').textContent=val;}

function saveEdit(){
  var r=RAW[editIdx],key=r.a+'|'+r.e,ov=JSON.parse(JSON.stringify(overrides[key]||{}));
  undoStack.push({type:'edit',idx:editIdx,key:key,prev:ov});

function closeEdit(){document.getElementById('edit-popup').classList.remove('show');document.getElementById('edit-overlay').classList.remove('show');}

function deleteRow(rawIdx){
  var r=RAW[rawIdx],key=r.a+'|'+r.e,ov=JSON.parse(JSON.stringify(overrides[key]||{}));
  undoStack.push({type:'delete',idx:rawIdx,key:key,prev:ov,raw:JSON.parse(JSON.stringify(RAW[rawIdx]))});

  document.getElementById('btn-undo').style.display='';

function openPanel(type){
  currentPanel=type;
  var titles={okrug:'Округ',district:'Район',metro:'Метро'};
  document.getElementById('ms-title').textContent=titles[type];
  document.getElementById('ms-search').value='';

function renderMsList(items){

    var div=document.createElement('div');div.className='ms-item'+(tempSel.has(v)?' selected':'');

function toggleMs(v){

function filterMsList(){
  var q=document.getElementById('ms-search').value.toLowerCase();

  renderMsList(q?all.filter(function(x){return x.toLowerCase().includes(q);}):all);
}
function clearSel(){tempSel.clear();filterMsList();}
function applyPanel(){
  if(currentPanel==='okrug') selOkrugs=new Set(tempSel);
  else if(currentPanel==='district') selDistricts=new Set(tempSel);
  else selMetros=new Set(tempSel);
  closePanel();applyFilters();
}
function closePanel(){document.getElementById('ms-overlay').classList.remove('show');document.getElementById('ms-panel').classList.remove('show');}

function saveData(){
  var payload={marks:marks,overrides:overrides,deleted:deleted,counter:counter,savedAt:new Date().toLocaleString('ru')};
  var blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;
  var d=new Date();a.download='домофоны_данные_'+d.getDate()+'.'+(d.getMonth()+1)+'.'+d.getFullYear()+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  showToast('💾 Данные сохранены!');
}
function loadData(event){
  var file=event.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var p=JSON.parse(e.target.result);
      if(p.marks){marks=p.marks;localStorage.setItem('marks',JSON.stringify(marks));}
      if(p.overrides){overrides=p.overrides;localStorage.setItem('overrides',JSON.stringify(overrides));}
      if(p.deleted){deleted=p.deleted;localStorage.setItem('deleted',JSON.stringify(deleted));}
      if(p.counter!==undefined){counter=p.counter;localStorage.setItem('cnt',counter);document.getElementById('counter').textContent=counter;}
      applyFilters();showToast('✅ Данные загружены'+(p.savedAt?' ('+p.savedAt+')':''));
    }catch(err){showToast('❌ Ошибка загрузки');}
  };
  reader.readAsText(file);event.target.value='';
}
function showToast(msg){
  var t=document.createElement('div');t.textContent=msg;
  t.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 16px;border-radius:10px;font-size:13px;z-index:9999;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.3)';
  document.body.appendChild(t);setTimeout(function(){document.body.removeChild(t);},2500);
}
function undoAction(){
  if(!undoStack.length) return;
  var action=undoStack.pop();
  if(action.type==='delete'){
    RAW[action.idx]=action.raw;
    overrides[action.key]=action.prev;
  } else {
    overrides[action.key]=action.prev;
  }
  localStorage.setItem('overrides',JSON.stringify(overrides));
  if(!undoStack.length) document.getElementById('btn-undo').style.display='none';
  applyFilters();
}

function ghSetStatus(msg,color){
  var el=document.getElementById('gh-status');
  el.textContent=msg;el.style.color=color||'#8e8e93';el.style.display='';
}

function saveToGitHub(){
  // Дебаунс — ждём 2 секунды после последнего изменения
  if(_ghSaveTimer) clearTimeout(_ghSaveTimer);
  _ghSaveTimer=setTimeout(function(){_doSaveGitHub();},2000);
  ghSetStatus('⏳ сохранение...','#8e8e93');
}

function _doSaveGitHub(){
  if(_ghSaving) return;
  _ghSaving=true;
  ghSetStatus('⏳ сохранение...','#8e8e93');

  // Встраиваем overrides в data.js
  var dbCopy=JSON.parse(JSON.stringify(DB));
  dbCopy.rows=dbCopy.rows.map(function(r){
    var key=r.a+'|'+r.e, ov=overrides[key]||{};
    return Object.assign({},r,{
      visits: ov.visits!==undefined?ov.visits:(r.visits||0),
      color:  ov.color!==undefined?ov.color:r.color,
      d:      ov.d!==undefined?ov.d:r.d,
      m:      ov.m!==undefined?ov.m:r.m,
      o:      ov.o!==undefined?ov.o:r.o,
      c1:     ov.c1!==undefined?ov.c1:r.c1,
      c2:     ov.c2!==undefined?ov.c2:r.c2,
    });
  });
  var newContent='var DB='+JSON.stringify(dbCopy,null,0)+';';
  var encoded=btoa(unescape(encodeURIComponent(newContent)));

  // Получаем текущий SHA файла
  fetch('https://api.github.com/repos/'+GH_REPO+'/contents/'+GH_FILE,{
    headers:{'Authorization':'token '+GH_TOKEN,'Accept':'application/vnd.github.v3+json'}
  })
  .then(function(r){return r.json();})
  .then(function(info){
    return fetch('https://api.github.com/repos/'+GH_REPO+'/contents/'+GH_FILE,{
      method:'PUT',
      headers:{'Authorization':'token '+GH_TOKEN,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
      body:JSON.stringify({message:'update data',content:encoded,sha:info.sha})
    });
  })
  .then(function(r){
    _ghSaving=false;
    if(r.ok){
      ghSetStatus('✅ сохранено','#34c759');
      setTimeout(function(){document.getElementById('gh-status').style.display='none';},3000);
      // Обновляем DB.rows чтобы visits/color были актуальны
      DB.rows=dbCopy.rows;
      overrides={};
      localStorage.setItem('overrides','{}');
    } else {
      ghSetStatus('❌ ошибка сохранения','#ff3b30');
    }
  })
  .catch(function(){
    _ghSaving=false;
    ghSetStatus('❌ нет связи','#ff3b30');
  });
}

function exportExcel(){
  var rows=[['№','Адрес','Подъезд','Код 1','Код 2','Район','Метро','Округ','Визитов']];
  filtered.forEach(function(r){rows.push([r.visits||r.n||'',r.a,r.e,r.c1||'',r.c2||'',r.d||'',r.m||'',r.o||'',r.visits||0]);});
  var csv=rows.map(function(row){return row.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"';}).join(',');}).join('\r\n');
  var blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;
  var d=new Date();a.download='домофоны_'+d.getDate()+'.'+(d.getMonth()+1)+'.'+d.getFullYear()+'.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}
function resetCounter(){
  if(confirm('Сбросить счётчик и отметки?')){counter=0;marks={};localStorage.setItem('cnt','0');localStorage.setItem('marks','{}');document.getElementById('counter').textContent='0';renderTable();}
}
document.getElementById('tbody').addEventListener('contextmenu',function(e){e.preventDefault();});
// Если база уже загружена (кэш) — инициализируем сразу
if (typeof DB !== 'undefined') initDB();
