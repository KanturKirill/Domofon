<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Домофоны</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --bg:#f2f2f7; --surface:#fff; --accent:#007aff; --text:#000; --text2:#6e6e73; --border:#c6c6c8;
  --red:#ff3b30; --green:#34c759;
}
body { background:var(--bg); color:var(--text); font-family:-apple-system,sans-serif; min-height:100vh; overflow-x:hidden; }
table { -webkit-user-select:none; user-select:none; }
td { -webkit-user-select:none; user-select:none; }

.header { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:8px 12px 7px; }
.header-row1 { display:flex; align-items:center; justify-content:space-between; margin-bottom:7px; }
.header-title { font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); }
.header-btns { display:flex; gap:4px; align-items:center; }
.hbtn { padding:4px 8px; border:none; border-radius:7px; color:#fff; font-size:11px; font-weight:700; cursor:pointer; }
.header-search { display:flex; align-items:center; margin-bottom:6px; gap:6px; }
.header-search input { flex:1; padding:7px 10px; border-radius:8px; border:1px solid var(--border); font-size:14px; outline:none; background:var(--bg); color:var(--text); }
.filters { display:flex; gap:4px; align-items:center; }
.filter-btn { flex:1; padding:7px 6px; background:var(--bg); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:11px; text-align:left; cursor:pointer; display:flex; justify-content:space-between; align-items:center; min-width:0; }
.filter-btn span:first-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.filter-btn.active { border-color:var(--accent); color:var(--accent); background:#e8f0fe; }
.stats { padding:3px 12px; font-size:10px; color:var(--text2); }
.stats b { color:var(--accent); }

.table-wrap { width:100%; overflow:hidden; }
table { width:100%; border-collapse:collapse; table-layout:fixed; }
colgroup col:nth-child(1) { width:18px; }
colgroup col:nth-child(2) { width:44%; }
colgroup col:nth-child(3) { width:22px; }
colgroup col:nth-child(4) { width:26%; }
colgroup col:nth-child(5) { width:28px; }
colgroup col:nth-child(6) { width:44px; }
thead th { background:#d0d0d8; padding:2px 3px; font-size:9px; font-weight:700; color:#333; border:1px solid #a0a0a8; text-align:center; height:20px; line-height:20px; }
td { padding:1px 3px; vertical-align:middle; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; border:1px solid #b0b0b8; height:22px; line-height:22px; font-size:11px; }
td:nth-child(1) { text-align:center; font-size:11px; font-weight:800; background:#fff; width:22px; }
td:nth-child(2) { font-size:11px; color:#000; direction:rtl; text-align:left; }
td:nth-child(3) { text-align:center; font-size:11px; }
td:nth-child(4) { font-size:10px; color:#000; font-family:'SF Mono',monospace; }
td:nth-child(5) { font-size:9px; color:#666; text-align:center; }
td:nth-child(6) { text-align:right; padding:1px 2px; border:none; background:transparent; }

.btn-kod { display:inline-flex; align-items:center; justify-content:center; height:20px; width:38px; border-radius:3px; background:var(--accent); border:none; cursor:pointer; font-size:9px; font-weight:700; color:#fff; }
.btn-kod.copied { background:var(--green); }

.c-blue{background:#00B0F0!important} .c-orange{background:#FFC000!important}
.c-green{background:#92D050!important} .c-yellow{background:#FFFF00!important}
.c-cyan{background:#00FFFF!important} .c-gold{background:#F1C232!important}
.c-lime{background:#00FF00!important} .c-amber{background:#BF9000!important}
.c-teal{background:#D0E0E3!important} .c-brown{background:#7F6000!important}
.c-blue td,.c-orange td,.c-green td,.c-yellow td,.c-cyan td,.c-gold td,.c-lime td,.c-amber td,.c-teal td,.c-brown td{color:#000!important}
td:nth-child(1){color:#007aff!important;font-weight:700!important}

#ctx-overlay { position:fixed; inset:0; z-index:500; opacity:0; pointer-events:none; transition:opacity .15s; }
#ctx-overlay.show { opacity:1; pointer-events:auto; }
#ctx-menu { position:fixed; background:var(--surface); border-radius:13px; box-shadow:0 8px 32px rgba(0,0,0,.18); z-index:501; min-width:200px; overflow:hidden; opacity:0; pointer-events:none; transition:all .15s; top:50%; left:50%; transform:translate(-50%,-50%) scale(.9); }
#ctx-menu.show { opacity:1; pointer-events:auto; transform:translate(-50%,-50%) scale(1); }
.ctx-addr { padding:10px 14px 6px; font-size:11px; color:var(--text2); border-bottom:1px solid var(--border); }
.ctx-colors { display:flex; gap:6px; padding:10px 14px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
.ctx-chip { width:26px; height:26px; border-radius:50%; cursor:pointer; border:2px solid transparent; display:flex; align-items:center; justify-content:center; font-size:11px; }
.ctx-chip.sel { border-color:#333; transform:scale(1.15); }
.ctx-item { display:flex; align-items:center; gap:10px; padding:12px 14px; cursor:pointer; font-size:14px; color:var(--text); border-bottom:1px solid #f0f0f0; }
.ctx-item:last-child { border-bottom:none; }
.ctx-item.danger { color:var(--red); }
.ctx-icon { font-size:16px; width:20px; text-align:center; }

#copy-overlay { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:300; opacity:0; pointer-events:none; transition:opacity .2s; }
#copy-overlay.show { opacity:1; pointer-events:auto; }
#copy-popup { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) scale(.88); background:#ffffff; border-radius:16px; padding:18px 20px; z-index:301; opacity:0; pointer-events:none; transition:all .18s; text-align:center; min-width:260px; max-width:88vw; box-shadow:0 8px 40px rgba(0,0,0,.15); }
#copy-popup.show { opacity:1; pointer-events:auto; transform:translate(-50%,-50%) scale(1); }
.popup-label { font-size:11px; color:var(--text2); margin-bottom:6px; }
.popup-main { font-size:20px; font-weight:800; color:var(--red); line-height:1.55; margin:8px 0 4px; white-space:pre-wrap; }
.popup-ok { font-size:12px; color:var(--green); margin-top:10px; opacity:0; transition:opacity .25s; }
.popup-ok.visible { opacity:1; }

#edit-overlay { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:600; opacity:0; pointer-events:none; transition:opacity .2s; }
#edit-overlay.show { opacity:1; pointer-events:auto; }
#edit-popup { position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-radius:16px 16px 0 0; border-top:1px solid var(--border); z-index:601; transform:translateY(100%); transition:transform .25s; max-height:82vh; display:flex; flex-direction:column; }
#edit-popup.show { transform:translateY(0); }
.edit-header { padding:11px 14px 8px; border-bottom:1px solid var(--border); flex-shrink:0; }
.edit-title { font-size:13px; font-weight:700; color:var(--accent); margin-bottom:2px; }
.edit-sub { font-size:11px; color:var(--text2); }
.edit-body { flex:1; overflow-y:auto; padding:10px 14px; display:flex; gap:10px; }
.edit-col { flex:1; display:flex; flex-direction:column; min-width:0; }
.edit-col-title { font-size:10px; color:var(--text2); font-weight:600; text-transform:uppercase; margin-bottom:5px; }
.edit-col-cur { font-size:11px; color:var(--accent); margin-bottom:5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.edit-col input { width:100%; padding:6px 8px; background:var(--bg); border:1px solid var(--border); border-radius:7px; color:var(--text); font-size:11px; margin-bottom:5px; }
.edit-col input:focus { outline:none; border-color:var(--accent); }
.edit-options { flex:1; overflow-y:auto; border:1px solid var(--border); border-radius:8px; min-height:130px; }
.edit-option { padding:8px 10px; font-size:12px; color:var(--text); cursor:pointer; border-bottom:1px solid #eee; }
.edit-option.selected { color:var(--accent); font-weight:600; background:#e8f0fe; }
.edit-footer { padding:10px 14px 22px; border-top:1px solid var(--border); display:flex; gap:8px; flex-shrink:0; }
.edit-btn { flex:1; padding:10px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; border:none; }
.edit-btn-cancel { background:var(--bg); color:var(--text2); }
.edit-btn-save { background:var(--accent); color:#fff; }

.ms-overlay { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:200; opacity:0; pointer-events:none; transition:opacity .2s; }
.ms-overlay.show { opacity:1; pointer-events:auto; }
.ms-panel { position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-radius:16px 16px 0 0; border-top:1px solid var(--border); z-index:201; transform:translateY(100%); transition:transform .25s; max-height:75vh; display:flex; flex-direction:column; }
.ms-panel.show { transform:translateY(0); }
.ms-header { padding:11px 14px 8px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.ms-title { font-size:13px; font-weight:700; }
.ms-actions { display:flex; gap:8px; }
.ms-btn { padding:5px 12px; border-radius:7px; font-size:12px; cursor:pointer; border:none; }
.ms-btn-clear { background:var(--bg); color:var(--text2); }
.ms-btn-apply { background:var(--accent); color:#fff; font-weight:600; }
.ms-search { padding:8px 12px; flex-shrink:0; }
.ms-search input { width:100%; padding:7px 10px; background:var(--bg); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:12px; }
.ms-list { overflow-y:auto; flex:1; padding:4px 0 8px; }
.ms-item { display:flex; align-items:center; gap:10px; padding:9px 14px; cursor:pointer; font-size:13px; }
.ms-checkbox { width:20px; height:20px; border-radius:5px; border:2px solid var(--border); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff; }
.ms-item.selected .ms-checkbox { background:var(--accent); border-color:var(--accent); }

#loading { position:fixed; inset:0; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:9999; }
#loading p { margin-top:12px; color:var(--text2); font-size:14px; }
.spinner { width:36px; height:36px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.empty-hint { text-align:center; padding:40px 20px; color:var(--text2); font-size:14px; }
#code-edit-overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:700; opacity:0; pointer-events:none; transition:opacity .2s; }
#code-edit-overlay.show { opacity:1; pointer-events:auto; }
#code-edit-popup { position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-radius:16px 16px 0 0; z-index:701; transform:translateY(100%); transition:transform .25s; padding:16px 14px 32px; }
#code-edit-popup.show { transform:translateY(0); }
#code-edit-popup .ce-title { font-size:11px; color:var(--text2); margin-bottom:6px; }
#code-edit-popup .ce-addr { font-size:13px; font-weight:700; color:var(--accent); margin-bottom:12px; }
#code-edit-popup textarea { width:100%; min-height:100px; padding:10px; border:1px solid var(--border); border-radius:8px; font-size:13px; font-family:'SF Mono',monospace; background:var(--bg); color:var(--text); resize:vertical; outline:none; }
#code-edit-popup textarea:focus { border-color:var(--accent); }
#code-edit-popup .ce-hint { font-size:10px; color:var(--text2); margin-top:6px; margin-bottom:12px; }
#code-edit-popup .ce-btns { display:flex; gap:8px; }
#code-edit-popup .ce-btn { flex:1; padding:10px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; border:none; }
#code-edit-popup .ce-btn-cancel { background:var(--bg); color:var(--text2); }
#code-edit-popup .ce-btn-save { background:var(--accent); color:#fff; }
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div><p>Загрузка...</p></div>

<div class="header">
  <div class="header-row1">
    <div class="header-title">📋 Домофоны Москвы</div>
    <div class="header-btns">
      <span id="sb-status" style="font-size:11px;color:#8e8e93;display:none;margin-right:4px"></span>
      <button class="hbtn" id="btn-undo" style="background:#8e8e93;display:none" onclick="undoAction()">↩</button>
    </div>
  </div>
  <div class="header-search">
    <input id="street-search" type="text" placeholder="Улица, адрес..."
      onkeydown="if(event.key==='Enter'){this.blur();doSearch();}">
    <button class="hbtn" style="background:var(--accent);white-space:nowrap" onclick="doSearch()">🔍 Найти</button>
  </div>
  <div class="filters">
    <button class="filter-btn" id="btn-okrug" onclick="openPanel('okrug')"><span id="lbl-okrug">Округ</span><span>▾</span></button>
    <button class="filter-btn" id="btn-district" onclick="openPanel('district')"><span id="lbl-district">Район</span><span>▾</span></button>
    <button class="filter-btn" id="btn-metro" onclick="openPanel('metro')"><span id="lbl-metro">Метро</span><span>▾</span></button>
  </div>
</div>
<div class="stats" id="stats"></div>

<div class="table-wrap">
  <table>
    <colgroup><col><col><col><col><col><col></colgroup>
    <thead><tr><th>№</th><th>Адрес</th><th>Пд</th><th>Код</th><th>Окр</th><th></th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
</div>
<div style="height:8px"></div>

<div id="ctx-overlay" onclick="closeCtx()"></div>
<div id="ctx-menu">
  <div class="ctx-addr" id="ctx-addr"></div>
  <div class="ctx-colors" id="ctx-colors"></div>
  <div class="ctx-item" onclick="ctxEdit()"><span class="ctx-icon">✏️</span> Изменить район / метро</div>
  <div class="ctx-item" onclick="ctxEditCode()"><span class="ctx-icon">🔑</span> Изменить код</div>
  <div class="ctx-item danger" onclick="ctxDelete()"><span class="ctx-icon">🗑</span> Удалить строку</div>
  <div class="ctx-item" onclick="closeCtx()" style="color:var(--text2);justify-content:center">Отмена</div>
</div>

<div id="copy-overlay" onclick="closeCopy()"></div>
<div id="copy-popup">
  <div class="popup-label" id="popup-addr"></div>
  <div class="popup-main" id="popup-text"></div>
  <div class="popup-ok" id="popup-ok">✓ Скопировано!</div>
</div>

<div id="edit-overlay" onclick="closeEdit()"></div>
<div id="edit-popup">
  <div class="edit-header">
    <div class="edit-title">✏️ Район и метро</div>
    <div class="edit-sub" id="edit-addr"></div>
  </div>
  <div class="edit-body">
    <div class="edit-col">
      <div class="edit-col-title">Район</div>
      <div class="edit-col-cur" id="edit-cur-d"></div>
      <input type="text" id="edit-d-search" placeholder="Поиск..." oninput="filterEditList('d')">
      <div class="edit-options" id="edit-d-list"></div>
    </div>
    <div class="edit-col">
      <div class="edit-col-title">Метро</div>
      <div class="edit-col-cur" id="edit-cur-m"></div>
      <input type="text" id="edit-m-search" placeholder="Поиск..." oninput="filterEditList('m')">
      <div class="edit-options" id="edit-m-list"></div>
    </div>
  </div>
  <div class="edit-footer">
    <button class="edit-btn edit-btn-cancel" onclick="closeEdit()">Отмена</button>
    <button class="edit-btn edit-btn-save" onclick="saveEdit()">Сохранить</button>
  </div>
</div>

<div id="code-edit-overlay" onclick="closeCodeEdit()"></div>
<div id="code-edit-popup">
  <div class="ce-title">Редактирование кода домофона</div>
  <div class="ce-addr" id="ce-addr"></div>
  <textarea id="ce-textarea" placeholder="Введите коды через запятую..."></textarea>
  <div class="ce-hint">Несколько кодов разделяйте запятой: 1234, 5678, 9012</div>
  <div class="ce-btns">
    <button class="ce-btn ce-btn-cancel" onclick="closeCodeEdit()">Отмена</button>
    <button class="ce-btn ce-btn-save" onclick="saveCodeEdit()">Сохранить</button>
  </div>
</div>

<div class="ms-overlay" id="ms-overlay" onclick="closePanel()"></div>
<div class="ms-panel" id="ms-panel">
  <div class="ms-header">
    <div class="ms-title" id="ms-title"></div>
    <div class="ms-actions">
      <button class="ms-btn ms-btn-clear" onclick="clearSel()">Сбросить</button>
      <button class="ms-btn ms-btn-apply" onclick="applyPanel()">Готово</button>
    </div>
  </div>
  <div class="ms-search"><input type="text" id="ms-search" placeholder="Поиск..." oninput="filterMsList()"></div>
  <div class="ms-list" id="ms-list"></div>
</div>

<script>
var SB_URL='https://kfalaiathjagthzmwmbx.supabase.co';
var SB_KEY='sb_publishable_fZINp8bhMAS3Z0agdvm_PQ_1rltC5kl';

function sbH(extra){
  return Object.assign({'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY},extra||{});
}
function sbStatus(msg,color){
  var el=document.getElementById('sb-status');
  el.textContent=msg;el.style.color=color||'#8e8e93';el.style.display='';
  if(msg==='✅') setTimeout(function(){el.style.display='none';},2000);
}

// Все данные
var ALL=[], FILTERED=[];
var ALL_OKRUGS=[], ALL_DISTRICTS=[], ALL_STATIONS=[];
var selOkrugs=new Set(), selDistricts=new Set(), selMetros=new Set();
var currentPanel=null, tempSel=new Set();
var ctxRow=null, editRow=null, editNewD, editNewM, editNewColor;
var undoStack=[];
var _activeSearch='';
var marks=JSON.parse(localStorage.getItem('marks')||'{}');

const COLOR_MAP={'FF00B0F0':'c-blue','FFFFC000':'c-orange','FF92D050':'c-green','FFFFFF00':'c-yellow','FF00FFFF':'c-cyan','FFF1C232':'c-gold','FF00FF00':'c-lime','FFBF9000':'c-amber','FFD0E0E3':'c-teal','FF7F6000':'c-brown'};
const CTX_COLORS=[{k:'',bg:'#e5e5ea',label:'Нет'},{k:'FF00B0F0',bg:'#00B0F0',label:'Синий'},{k:'FFFFC000',bg:'#FFC000',label:'Оранжевый'},{k:'FF92D050',bg:'#92D050',label:'Зелёный'},{k:'FFFFFF00',bg:'#FFFF00',label:'Жёлтый'},{k:'FF00FFFF',bg:'#00FFFF',label:'Голубой'},{k:'FFF1C232',bg:'#F1C232',label:'Золотой'}];

// Загрузка всех данных из Supabase
function loadAll(){
  document.getElementById('loading').style.display='flex';
  // Шаг 1: один быстрый запрос — получаем все уникальные значения фильтров
  fetch(SB_URL+'/rest/v1/filter_values?select=okrugs,districts,metros',{headers:sbH()})
  .then(function(r){return r.json();})
  .then(function(rows){
    if(!Array.isArray(rows)||!rows[0]){
      document.getElementById('loading').innerHTML='<p style="color:red;padding:20px;text-align:center">Ошибка загрузки фильтров</p>';
      return;
    }
    var d=rows[0];
    ALL_OKRUGS=['',...(d.okrugs||[])];
    ALL_DISTRICTS=['',...(d.districts||[])];
    ALL_STATIONS=['',...(d.metros||[])];
    restoreState();
    document.getElementById('loading').style.display='none';
    if(selOkrugs.size||selDistricts.size||selMetros.size||_activeSearch){
      loadFiltered();
    } else {
      updateBtns();
      document.getElementById('tbody').innerHTML='<tr><td colspan="6"><div class="empty-hint">Выберите округ, район или метро</div></td></tr>';
      document.getElementById('stats').innerHTML='';
    }
  })
  .catch(function(e){
    document.getElementById('loading').innerHTML='<p style="color:red;padding:20px;text-align:center">Ошибка загрузки.<br>'+e.message+'</p>';
  });
}

function loadFiltered(){
  document.getElementById('loading').style.display='flex';
  var filters=[];
  if(selOkrugs.size&&!selOkrugs.has('')){
    var vals=[...selOkrugs].map(function(v){return 'okrug.eq.'+encodeURIComponent(v);});
    filters.push('or=('+vals.join(',')+')');
  }
  if(selDistricts.size&&!selDistricts.has('')){
    var vals=[...selDistricts].map(function(v){return 'district.eq.'+encodeURIComponent(v);});
    filters.push('or=('+vals.join(',')+')');
  }
  if(selMetros.size&&!selMetros.has('')){
    var vals=[...selMetros].map(function(v){return 'metro.eq.'+encodeURIComponent(v);});
    filters.push('or=('+vals.join(',')+')');
  }
  var query=filters.length?filters.join('&'):'';
  var all=[];
  function fetchPage(from){
    var url=SB_URL+'/rest/v1/domofony?select=*&deleted=eq.false&order=address,entrance&offset='+from+'&limit=1000'+(query?'&'+query:'');
    fetch(url,{headers:sbH()})
    .then(function(r){return r.json();})
    .then(function(rows){
      if(!Array.isArray(rows)){
        document.getElementById('loading').style.display='none';
        return;
      }
      all=all.concat(rows);
      if(rows.length===1000){
        fetchPage(from+1000);
      } else {
        ALL=all;
        document.getElementById('loading').style.display='none';
        applyFilters();
        // Скроллим к последней скопированной строке
        var lastId=localStorage.getItem('lastCopiedId');
        if(lastId){
          setTimeout(function(){
            var tr=document.querySelector('tr[data-id="'+lastId+'"]');
            if(tr) tr.scrollIntoView({block:'center'});
          },100);
        }
      }
    })
    .catch(function(){document.getElementById('loading').style.display='none';});
  }
  fetchPage(0);
}

function buildFilters(){
  var okrugs=new Set(), districts=new Set(), metros=new Set();
  ALL.forEach(function(r){
    if(r.okrug) okrugs.add(r.okrug);
    if(r.district) districts.add(r.district);
    if(r.metro) metros.add(r.metro);
  });
  ALL_OKRUGS=['',...Array.from(okrugs).sort()];
  ALL_DISTRICTS=['',...Array.from(districts).sort()];
  ALL_STATIONS=['',...Array.from(metros).sort()];
}

function saveState(){
  localStorage.setItem('filterState',JSON.stringify({
    okrugs:[...selOkrugs],districts:[...selDistricts],metros:[...selMetros],search:_activeSearch
  }));
}
function restoreState(){
  try{
    var s=JSON.parse(localStorage.getItem('filterState')||'{}');
    if(s.okrugs) selOkrugs=new Set(s.okrugs);
    if(s.districts) selDistricts=new Set(s.districts);
    if(s.metros) selMetros=new Set(s.metros);
    if(s.search){_activeSearch=s.search;document.getElementById('street-search').value=s.search;}
  }catch(e){}
}

function doSearch(){
  var val=document.getElementById('street-search').value.trim();
  if(val.length>0&&val.length<3){alert('Введите минимум 3 символа');return;}
  _activeSearch=val.toLowerCase();
  saveState();
  if(!selOkrugs.size&&!selDistricts.size&&!selMetros.size&&_activeSearch){
    ALL=[];
    loadFiltered();
  } else {
    applyFilters();
  }
}

function applyFilters(){
  var s=_activeSearch;
  if(!selOkrugs.size&&!selDistricts.size&&!selMetros.size&&!s){
    document.getElementById('tbody').innerHTML='<tr><td colspan="6"><div class="empty-hint">Выберите округ, район или метро</div></td></tr>';
    document.getElementById('stats').innerHTML='';
    updateBtns();return;
  }
  var searchOnly=(!selOkrugs.size&&!selDistricts.size&&!selMetros.size&&!!s);
  FILTERED=ALL.filter(function(r){
    var oMatch=searchOnly||!selOkrugs.size||selOkrugs.has(r.okrug)||(selOkrugs.has('')&&!r.okrug);
    var dMatch=searchOnly||!selDistricts.size||selDistricts.has(r.district)||(selDistricts.has('')&&!r.district);
    var mMatch=searchOnly||!selMetros.size||selMetros.has(r.metro);
    var sMatch=!s||r.address.toLowerCase().split(',')[0].indexOf(s)!==-1;
    if(!oMatch||!sMatch) return false;
    if(selDistricts.size&&selMetros.size) return dMatch||mMatch;
    return dMatch&&mMatch;
  });
  renderTable();
  updateBtns();
}

function renderTable(){
  var tbody=document.getElementById('tbody');
  document.getElementById('stats').innerHTML='Показано: <b>'+FILTERED.length+'</b> из <b>'+ALL.length+'</b>';
  tbody.innerHTML='';
  FILTERED.forEach(function(r){
    var key=r.address+'|'+r.entrance;
    var mark=marks[key]||'';
    var cls=r.color?(COLOR_MAP[r.color]||''):'';
    var tr=document.createElement('tr');
    if(cls) tr.className=cls;
    tr.setAttribute('data-id',r.id);

    var t0=document.createElement('td');
    t0.textContent=r.visits>0?r.visits:(r.n||'');
    tr.appendChild(t0);

    var t1=document.createElement('td');t1.textContent=r.address;tr.appendChild(t1);
    var t2=document.createElement('td');t2.textContent=r.entrance;tr.appendChild(t2);
    var t3=document.createElement('td');t3.textContent=r.code||'';t3.setAttribute('data-id',r.id);tr.appendChild(t3);
    var tO=document.createElement('td');tO.textContent=r.okrug||'';tr.appendChild(tO);

    var t4=document.createElement('td');
    var btn=document.createElement('button');
    btn.className='btn-kod'+(mark?' copied':'');
    btn.textContent=mark?'✓':'КОД';
    btn.setAttribute('data-copy-id',r.id);
    t4.appendChild(btn);tr.appendChild(t4);

    tbody.appendChild(tr);
  });
  initEvents();
}

var _eventsInited=false;
function initEvents(){
  var tbody=document.getElementById('tbody');
  if(tbody._ei) return;
  tbody._ei=true;

  var lastTap=0,lastCell=null;
  tbody.addEventListener('touchend',function(e){
    var cell=e.target.closest('td[data-id]');
    if(!cell) return;
    var now=Date.now();
    if(now-lastTap<300&&lastCell===cell){e.preventDefault();startEditCode(cell);}
    lastTap=now;lastCell=cell;
  });
  tbody.addEventListener('dblclick',function(e){
    var cell=e.target.closest('td[data-id]');
    if(cell) startEditCode(cell);
  });
  tbody.addEventListener('click',function(e){
    var btn=e.target.closest('button[data-copy-id]');
    if(btn){e.stopPropagation();copyRow(parseInt(btn.getAttribute('data-copy-id')));}
  });
  var timer=null;
  tbody.addEventListener('touchstart',function(e){
    var row=e.target.closest('tr[data-id]');
    if(!row) return;
    timer=setTimeout(function(){timer=null;openCtx(parseInt(row.getAttribute('data-id')));},500);
  },{passive:true});
  tbody.addEventListener('touchend',function(){if(timer){clearTimeout(timer);timer=null;}});
  tbody.addEventListener('touchmove',function(){if(timer){clearTimeout(timer);timer=null;}},{passive:true});
  tbody.addEventListener('contextmenu',function(e){
    var row=e.target.closest('tr[data-id]');
    if(row){e.preventDefault();openCtx(parseInt(row.getAttribute('data-id')));}
  });
}

function findRow(id){return ALL.find(function(r){return r.id===id;});}

function updateRow(id,fields){
  // Обновляем локально
  var r=findRow(id);
  if(r) Object.assign(r,fields);
  // Обновляем в Supabase
  fields.updated_at=new Date().toISOString();
  fetch(SB_URL+'/rest/v1/domofony?id=eq.'+id,{
    method:'PATCH',
    headers:sbH({'Prefer':'return=minimal'}),
    body:JSON.stringify(fields)
  }).then(function(r){
    sbStatus('✅');
  }).catch(function(){sbStatus('❌','#ff3b30');});
}

function updateBtns(){
  document.getElementById('lbl-okrug').textContent=selOkrugs.size?(selOkrugs.size===1?[...selOkrugs][0]:'Округов: '+selOkrugs.size):'Округ';
  document.getElementById('btn-okrug').classList.toggle('active',!!selOkrugs.size);
  document.getElementById('lbl-district').textContent=selDistricts.size?(selDistricts.size===1?[...selDistricts][0]:'Районов: '+selDistricts.size):'Район';
  document.getElementById('btn-district').classList.toggle('active',!!selDistricts.size);
  document.getElementById('lbl-metro').textContent=selMetros.size?(selMetros.size===1?[...selMetros][0]:'Метро: '+selMetros.size):'Метро';
  document.getElementById('btn-metro').classList.toggle('active',!!selMetros.size);
}

function copyRow(id){
  var r=findRow(id);if(!r) return;
  var firstCode=(r.code||'').split(',')[0].trim();
  var txt=r.address+'\nп: '+r.entrance+'\nКод: '+firstCode+'\nЭтаж: ';
  var htmlTxt='<span style="color:red;font-size:18pt;font-weight:bold">'+r.address+'&nbsp;&nbsp;п'+r.entrance+'<br>код '+firstCode+'&nbsp;&nbsp;Этаж </span>';
  // Clipboard первым!
  try{
    var item=new ClipboardItem({'text/plain':new Blob([txt],{type:'text/plain'}),'text/html':new Blob([htmlTxt],{type:'text/html'})});
    navigator.clipboard.write([item]).then(function(){document.getElementById('popup-ok').classList.add('visible');}).catch(function(){navigator.clipboard.writeText(txt).then(function(){document.getElementById('popup-ok').classList.add('visible');});});
  }catch(e){
    navigator.clipboard?navigator.clipboard.writeText(txt).then(function(){document.getElementById('popup-ok').classList.add('visible');}):void 0;
  }
  document.getElementById('popup-addr').textContent=r.address+' • Подъезд '+r.entrance;
  document.getElementById('popup-text').textContent='Код: '+firstCode+'\nЭтаж: ';
  document.getElementById('popup-ok').classList.remove('visible');
  document.getElementById('copy-popup').classList.add('show');
  document.getElementById('copy-overlay').classList.add('show');

  // Обновляем визиты
  var key=r.address+'|'+r.entrance;
  var now=new Date();
  marks[key]=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
  localStorage.setItem('marks',JSON.stringify(marks));
  localStorage.setItem('lastCopiedId',String(id));

  var newVisits=(r.visits||0)+1;
  undoStack.push({id:id,fields:{visits:r.visits||0}});
  if(undoStack.length>30) undoStack.shift();
  document.getElementById('btn-undo').style.display='';

  updateRow(id,{visits:newVisits});

  // Обновляем ячейку визитов в таблице
  document.querySelectorAll('tr[data-id="'+id+'"] td:first-child').forEach(function(td){
    td.textContent=newVisits;
  });
  setTimeout(function(){closeCopy();},1200);
}
function closeCopy(){document.getElementById('copy-popup').classList.remove('show');document.getElementById('copy-overlay').classList.remove('show');}

function openCtx(id){
  ctxRow=findRow(id);if(!ctxRow) return;
  editNewColor=ctxRow.color||'';
  document.getElementById('ctx-addr').textContent=ctxRow.address+' • Подъезд '+ctxRow.entrance;
  renderCtxColors();
  document.getElementById('ctx-overlay').classList.add('show');
  document.getElementById('ctx-menu').classList.add('show');
}
function renderCtxColors(){
  var el=document.getElementById('ctx-colors');el.innerHTML='';
  CTX_COLORS.forEach(function(c){
    var chip=document.createElement('div');
    chip.className='ctx-chip'+(editNewColor===c.k?' sel':'');
    chip.style.background=c.bg;chip.title=c.label;chip.textContent=c.k===''?'✕':'';
    chip.onclick=(function(k){return function(e){
      e.stopPropagation();editNewColor=k;
      undoStack.push({id:ctxRow.id,fields:{color:ctxRow.color||''}});
      if(undoStack.length>30) undoStack.shift();
      document.getElementById('btn-undo').style.display='';
      updateRow(ctxRow.id,{color:k});
      // Обновляем класс строки
      var tr=document.querySelector('tr[data-id="'+ctxRow.id+'"]');
      if(tr) tr.className=k?(COLOR_MAP[k]||''):'';
      renderCtxColors();
    };})(c.k);
    el.appendChild(chip);
  });
}
function ctxEdit(){closeCtx();openEdit(ctxRow.id);}
function ctxEditCode(){closeCtx();var cell=document.querySelector('td[data-id="'+ctxRow.id+'"]');if(cell)startEditCode(cell);}
function ctxDelete(){
  closeCtx();
  if(!confirm('Удалить строку?')) return;
  undoStack.push({id:ctxRow.id,fields:{deleted:false}});
  if(undoStack.length>30) undoStack.shift();
  document.getElementById('btn-undo').style.display='';
  updateRow(ctxRow.id,{deleted:true});
  ALL=ALL.filter(function(r){return r.id!==ctxRow.id;});
  applyFilters();
}
function closeCtx(){document.getElementById('ctx-overlay').classList.remove('show');document.getElementById('ctx-menu').classList.remove('show');}

var _codeEditId=null;
function startEditCode(cell){
  var id=parseInt(cell.getAttribute('data-id'));
  var r=findRow(id);if(!r) return;
  _codeEditId=id;
  document.getElementById('ce-addr').textContent=r.address+' • Подъезд '+r.entrance;
  document.getElementById('ce-textarea').value=r.code||'';
  document.getElementById('code-edit-overlay').classList.add('show');
  document.getElementById('code-edit-popup').classList.add('show');
  setTimeout(function(){document.getElementById('ce-textarea').focus();},300);
}
function closeCodeEdit(){
  document.getElementById('code-edit-overlay').classList.remove('show');
  document.getElementById('code-edit-popup').classList.remove('show');
  _codeEditId=null;
}
function saveCodeEdit(){
  if(!_codeEditId) return;
  var r=findRow(_codeEditId);if(!r) return;
  var val=document.getElementById('ce-textarea').value.trim();
  if(val!==r.code){
    undoStack.push({id:_codeEditId,fields:{code:r.code||''}});
    if(undoStack.length>30) undoStack.shift();
    document.getElementById('btn-undo').style.display='';
    updateRow(_codeEditId,{code:val});
    // Обновляем ячейку в таблице
    var cell=document.querySelector('td[data-id="'+_codeEditId+'"]');
    if(cell) cell.textContent=val;
  }
  closeCodeEdit();
}

function openEdit(id){
  editRow=findRow(id);if(!editRow) return;
  editNewD=editRow.district;editNewM=editRow.metro;
  document.getElementById('edit-addr').textContent=editRow.address+' • Подъезд '+editRow.entrance;
  document.getElementById('edit-cur-d').textContent=editRow.district||'—';
  document.getElementById('edit-cur-m').textContent=editRow.metro||'—';
  document.getElementById('edit-d-search').value='';
  document.getElementById('edit-m-search').value='';
  renderEditList('d',ALL_DISTRICTS,editRow.district);
  renderEditList('m',ALL_STATIONS,editRow.metro);
  document.getElementById('edit-overlay').classList.add('show');
  document.getElementById('edit-popup').classList.add('show');
}
function renderEditList(type,items,cur){
  var el=document.getElementById('edit-'+type+'-list');el.innerHTML='';
  items.forEach(function(v){
    var d=document.createElement('div');d.className='edit-option'+(v===cur?' selected':'');
    d.textContent=v||'— Не указан —';
    d.onclick=(function(val){return function(){selectEdit(type,val);};})(v);
    el.appendChild(d);
  });
  setTimeout(function(){var s=el.querySelector('.selected');if(s)s.scrollIntoView({block:'center'});},50);
}
function filterEditList(type){
  var q=document.getElementById('edit-'+type+'-search').value.toLowerCase();
  var all=type==='d'?ALL_DISTRICTS:ALL_STATIONS,cur=type==='d'?editNewD:editNewM;
  renderEditList(type,q?all.filter(function(x){return x.toLowerCase().includes(q);}):all,cur);
}
function selectEdit(type,val){
  if(type==='d'){editNewD=val;document.getElementById('edit-cur-d').textContent=val||'—';}
  else{editNewM=val;document.getElementById('edit-cur-m').textContent=val||'—';}
  filterEditList(type);
}
function saveEdit(){
  undoStack.push({id:editRow.id,fields:{district:editRow.district,metro:editRow.metro}});
  if(undoStack.length>30) undoStack.shift();
  document.getElementById('btn-undo').style.display='';
  updateRow(editRow.id,{district:editNewD,metro:editNewM});
  closeEdit();applyFilters();
}
function closeEdit(){document.getElementById('edit-popup').classList.remove('show');document.getElementById('edit-overlay').classList.remove('show');}

function undoAction(){
  if(!undoStack.length) return;
  var action=undoStack.pop();
  var r=findRow(action.id);
  
  // Если откат удаления — возвращаем строку в ALL
  if(action.fields.deleted===false){
    if(r){
      Object.assign(r,action.fields);
    } else {
      // Строки нет в ALL — нужно добавить обратно из Supabase
      fetch(SB_URL+'/rest/v1/domofony?id=eq.'+action.id+'&select=*',{headers:sbH()})
      .then(function(resp){return resp.json();})
      .then(function(rows){
        if(rows&&rows[0]){
          rows[0].deleted=false;
          ALL.push(rows[0]);
          ALL.sort(function(a,b){return a.address.localeCompare(b.address,undefined,{numeric:true})||a.entrance-b.entrance;});
        }
        updateRow(action.id,{deleted:false});
        applyFilters();
      });
      if(!undoStack.length) document.getElementById('btn-undo').style.display='none';
      return;
    }
  } else if(r){
    Object.assign(r,action.fields);
  }
  
  updateRow(action.id,action.fields);
  if(!undoStack.length) document.getElementById('btn-undo').style.display='none';
  
  // Обновляем ячейки в таблице
  var tr=document.querySelector('tr[data-id="'+action.id+'"]');
  if(tr){
    if(action.fields.visits!==undefined){
      var t0=tr.querySelector('td:first-child');
      if(t0) t0.textContent=action.fields.visits>0?action.fields.visits:(r?r.n||'':'');
    }
    if(action.fields.color!==undefined){
      tr.className=action.fields.color?(COLOR_MAP[action.fields.color]||''):'';
    }
    if(action.fields.code!==undefined){
      var t3=tr.querySelector('td[data-id]');
      if(t3) t3.textContent=action.fields.code||'';
    }
  }
  applyFilters();
}

function openPanel(type){
  currentPanel=type;
  var titles={okrug:'Округ',district:'Район',metro:'Метро'};
  document.getElementById('ms-title').textContent=titles[type];
  document.getElementById('ms-search').value='';
  tempSel=new Set(type==='okrug'?selOkrugs:type==='district'?selDistricts:selMetros);
  renderMsList(type==='okrug'?ALL_OKRUGS:type==='district'?ALL_DISTRICTS:ALL_STATIONS);
  document.getElementById('ms-overlay').classList.add('show');
  document.getElementById('ms-panel').classList.add('show');
}
function renderMsList(items){
  var list=document.getElementById('ms-list');list.innerHTML='';
  items.forEach(function(v){
    var div=document.createElement('div');div.className='ms-item'+(tempSel.has(v)?' selected':'');
    var chk=document.createElement('div');chk.className='ms-checkbox';chk.textContent=tempSel.has(v)?'✓':'';
    var lbl=document.createElement('div');lbl.textContent=v||'— Не указан —';
    div.appendChild(chk);div.appendChild(lbl);
    div.onclick=function(){toggleMs(v);};list.appendChild(div);
  });
}
function toggleMs(v){
  tempSel.has(v)?tempSel.delete(v):tempSel.add(v);
  var q=document.getElementById('ms-search').value.toLowerCase();
  var all=currentPanel==='okrug'?ALL_OKRUGS:currentPanel==='district'?ALL_DISTRICTS:ALL_STATIONS;
  renderMsList(q?all.filter(function(x){return x.toLowerCase().includes(q);}):all);
}
function filterMsList(){
  var q=document.getElementById('ms-search').value.toLowerCase();
  var all=currentPanel==='okrug'?ALL_OKRUGS:currentPanel==='district'?ALL_DISTRICTS:ALL_STATIONS;
  renderMsList(q?all.filter(function(x){return x.toLowerCase().includes(q);}):all);
}
function clearSel(){tempSel.clear();filterMsList();}
function applyPanel(){
  if(currentPanel==='okrug') selOkrugs=new Set(tempSel);
  else if(currentPanel==='district') selDistricts=new Set(tempSel);
  else selMetros=new Set(tempSel);
  closePanel();saveState();
  ALL=[];
  localStorage.removeItem('scrollPos');
  // Если все фильтры пустые — показываем пустой экран, не грузим базу
  if(!selOkrugs.size&&!selDistricts.size&&!selMetros.size&&!_activeSearch){
    FILTERED=[];
    document.getElementById('tbody').innerHTML='<tr><td colspan="6"><div class="empty-hint">Выберите округ, район или метро</div></td></tr>';
    document.getElementById('stats').innerHTML='';
    updateBtns();
    return;
  }
  loadFiltered();
}
function closePanel(){document.getElementById('ms-overlay').classList.remove('show');document.getElementById('ms-panel').classList.remove('show');}

// scrollPos не используется — скролл по lastCopiedId

// Старт
loadAll();
</script>
</body>
